<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dungeon Pals v2 — The Emberdeep</title>
<script>
  /* URL escape hatch for stale caches: open the site with ?reset (or #reset) to wipe cached data
     + code and reload fresh. Inline so it runs before any module loads and works even when the
     cached app JS is old (index.html?reset is a fresh document fetch). */
  (function () {
    if (/[?&#]reset\b/.test(location.search + location.hash)) {
      var done = function () { location.replace(location.pathname + "?fresh=" + Date.now()); };
      try { localStorage.clear(); } catch (e) {}
      try { sessionStorage.clear(); } catch (e) {}
      var jobs = [];
      try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
      try { if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
      if (jobs.length) Promise.all(jobs).then(done, done); else done();
    } else if (/[?&]fresh=/.test(location.search)) {
      try { history.replaceState(null, "", location.pathname); } catch (e) {}   /* tidy the URL after a reset */
    }
  })();
</script>
<style>
  :root{ --ink:#0c0a12; --panel:#171221; --line:#332a48; --gold:#d8a24a; --parchment:#e8dcc4;
    --hp:#e5484d; --hpbg:#4a1f26; --rare:#4da6ff; --epic:#c77dff; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:radial-gradient(120% 90% at 50% -10%, #241b38 0%, var(--ink) 60%);
    color:var(--parchment); font-family:Georgia,"Times New Roman",serif;
    display:flex; justify-content:center; overflow:hidden; height:100dvh;}
  #app{width:min(500px,100vw);height:100dvh;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 4px) 8px calc(env(safe-area-inset-bottom) + 6px)}

  /* --- collapsible combat log at TOP --- */
  #logwrap{flex:0 0 auto;background:#120d1c;border:1px solid var(--line);border-radius:8px;
    display:flex;flex-direction:column;overflow:hidden;margin-bottom:6px}
  #logbar{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;cursor:pointer;
    background:linear-gradient(#221a35,#191226);border-bottom:1px solid var(--line);flex:0 0 auto}
  #logbar .t{font-size:10px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
  #logbar .x{font-size:11px;color:#9a8fb8;font-family:monospace}
  #log{overflow-y:auto;padding:5px 8px;font-size:10.5px;line-height:1.5;transition:height .18s ease}
  /* three states via data-attr on #logwrap */
  #logwrap[data-s="min"] #log{height:16px}
  #logwrap[data-s="mid"] #log{height:70px}
  #logwrap[data-s="max"] #log{height:calc(100dvh - 120px)}
  #log .hit{color:#ffd166}#log .miss{color:#8b7fa8}#log .crit{color:#ff6b6b;font-weight:bold}
  #log .heal{color:#7ee787}#log .sys{color:#9ad1ff}#log .dmg{color:#ff9b8a}

  /* --- dungeon stage: flexes to fill remaining space --- */
  #stage{flex:1 1 auto;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:4px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas#cv{max-width:100%;max-height:100%;display:block;border-radius:6px}
  #logwrap[data-s="max"] ~ #stage{display:none} /* full-screen log hides the board */

  /* --- party at BOTTOM --- */
  #party{flex:0 0 auto;display:flex;gap:6px;margin-top:6px}
  .card{flex:1;display:flex;gap:6px;background:linear-gradient(#241b38,#1a1328);border:1px solid var(--line);
    border-radius:8px;padding:5px;font-size:9.5px;line-height:1.35}
  .card .picwrap{position:relative;flex:0 0 auto;width:36px;height:36px}
  .card .pic{width:36px;height:36px;border-radius:6px;border:1px solid #6e5a2a;display:block}
  .card .skull{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .card b{font-size:10.5px;color:var(--gold)} .card .lvl{color:#9ad1ff}
  .card .cls{color:#9a8fb8;text-transform:capitalize;font-style:italic}
  .card .fallen{color:#c98a8a;font-style:italic;display:inline-flex;align-items:center;gap:3px;margin-top:3px}
  .bar{height:5px;background:var(--hpbg);border-radius:3px;overflow:hidden;margin:2px 0}
  .bar i{display:block;height:100%;background:linear-gradient(#ff7a70,var(--hp));transition:width .25s}
  .card .gear{opacity:.8;font-style:italic}
  .card.dead{opacity:.8;border-color:#5a2a2a}
  .card.dead .pic{filter:grayscale(1) brightness(.7)}
  /* main hero: centered, slightly larger, gold-framed so the leader stands out */
  .card.main{flex:1.25;border-color:var(--gold);background:linear-gradient(#2c2440,#201636);
    box-shadow:0 0 0 1px rgba(216,162,74,.5) inset, 0 2px 10px rgba(216,162,74,.22)}
  .card.main .picwrap,.card.main .pic{width:44px;height:44px}
  .card.main .pic{border-color:var(--gold)}

  button{font-family:inherit;font-weight:bold;letter-spacing:1px;font-size:12.5px;border:0;border-radius:8px;
    padding:11px 0;flex:1;cursor:pointer;background:linear-gradient(#e0b063,#a8722a);color:#241606;box-shadow:0 3px 0 #6e4a14}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 #6e4a14}
  button[disabled]{opacity:.45;pointer-events:none}

  /* --- dungeon header: title · tappable room minimap · boss timer + speed --- */
  #dhead{flex:0 0 auto;display:none;flex-direction:column;gap:7px;margin-bottom:6px;padding:8px 11px 9px;
    border:1px solid var(--line);border-radius:10px;background:linear-gradient(#1b1330,#150f24)}
  #dhead.show{display:flex}
  .dh-top{display:flex;align-items:center;gap:8px}
  .dh-top .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dh-top .tt b{font-size:12.5px;color:#f0c877} .dh-top .tt span{font-size:10px;color:#b9add6;font-style:italic}
  .dh-boss{font-family:monospace;font-size:9px;letter-spacing:.06em;color:var(--gold);background:#120d1c;border:1px solid #5a4a2a;border-radius:999px;padding:2px 7px;white-space:nowrap}
  .dh-boss.ready{color:#ff9a5c;border-color:#6a3a2a}
  .dh-spd{font-family:monospace;font-size:10px;color:#b9add6;background:#241b38;border:1px solid var(--line);border-radius:7px;padding:3px 8px;cursor:pointer;flex:0 0 auto}
  .dh-mini{display:flex;align-items:center;gap:0;width:100%}
  .dh-node{position:relative;flex:1;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:none;box-shadow:none;padding:0;border-radius:0}
  .dh-node:active{transform:none}
  .dh-node::before{content:"";position:absolute;left:-50%;right:50%;top:50%;height:2px;background:var(--seg,#3a2f52);z-index:0}
  .dh-node:first-child::before{display:none}
  .dh-node .dot{position:relative;z-index:1;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--nc,#4a4360);
    background:radial-gradient(circle at 40% 35%,#241b38,#0d0a16);display:grid;place-items:center;font-family:monospace;font-size:8px;font-weight:bold;color:var(--nc,#6d6390)}
  .dh-node.done{--nc:#8fd39a;--seg:#2f5a3e} .dh-node.done+.dh-node::before{--seg:#2f5a3e}
  .dh-node.cur .dot{--nc:#f0c877;color:#f0c877;box-shadow:0 0 0 3px rgba(240,200,119,.18)}
  .dh-node.cur .ring{position:absolute;inset:-4px;border-radius:50%;border:1.5px solid #f0c877;animation:dhpulse 1.8s ease-out infinite;z-index:0}
  @keyframes dhpulse{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.5);opacity:0}}
  .dh-node.next .dot{border-style:dashed;--nc:#c9a04a}
  .dh-node.boss .dot{border-color:#c0553f} .dh-node.boss.cur .dot{border-color:#f0c877}
  .dh-node.lock{cursor:default} .dh-node.lock .dot{opacity:.5}
  .dh-node.cur:active .dot,.dh-node.done:active .dot,.dh-node.next:active .dot{transform:scale(.85)}

  /* --- bottom nav bar (Keep · World · Pause · Arena · Menu) --- */
  #dnav{flex:0 0 auto;display:flex;align-items:stretch;height:60px;margin-top:6px;position:relative;
    background:linear-gradient(#150f24,#0d0a16);border:1px solid #4a3d68;border-radius:12px;overflow:visible}
  #dnav::before{content:"";position:absolute;left:12px;right:12px;top:0;height:1px;background:linear-gradient(90deg,transparent,#e0b06355,transparent)}
  .dn-tab{flex:1;background:none;box-shadow:none;color:#6f6486;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-family:inherit;font-weight:normal;font-size:10px;letter-spacing:.02em;padding:0;border-radius:0}
  .dn-tab:active{transform:translateY(1px);box-shadow:none}
  .dn-tab svg{width:21px;height:21px;opacity:.9}
  .dn-cta{flex:0 0 auto;width:74px;display:flex;align-items:center;justify-content:center;position:relative}
  #btnStart{width:52px;height:52px;flex:0 0 auto;border-radius:50%;padding:0;border:2px solid #f0c877;color:#241606;
    background:radial-gradient(circle at 42% 34%,#f4d493,#c2892f 70%,#9a6b22);box-shadow:0 5px 14px -5px #000,inset 0 2px 3px #fff3;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
  #btnStart svg{width:20px;height:20px}
  #btnStart span{font-size:8px;font-weight:bold;text-transform:uppercase;letter-spacing:.04em;margin-top:-1px}
  #btnStart:active{transform:translateY(1px);box-shadow:0 3px 10px -5px #000}
  #btnStart.resume{background:radial-gradient(circle at 42% 34%,#a7d6b0,#3a8a5a 70%,#256b40);color:#04140f;border-color:#8fd39a}

  #dtoast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 74px);transform:translateX(-50%);z-index:6;
    background:#120d1cee;border:1px solid var(--gold);color:var(--gold);font-family:monospace;font-size:11px;padding:7px 13px;
    border-radius:9px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;box-shadow:0 6px 18px #000;max-width:88vw;text-align:center}
  #dtoast.on{opacity:1}
  @media (prefers-reduced-motion:reduce){.dh-node.cur .ring{animation:none}}

  #overlay{position:absolute;inset:0;background:rgba(8,5,14,.6);display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;padding:20px;z-index:5;backdrop-filter:blur(1.5px)}
  #overlay.show{display:flex}
  #overlay h2{color:var(--gold);letter-spacing:2px;text-transform:uppercase;font-size:18px}
  #overlay p{font-size:12px;opacity:.9;text-align:center;max-width:300px;line-height:1.5}
  .loot{width:100%;max-width:320px;background:linear-gradient(#241b38,#181128);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;font-size:12px;line-height:1.45;
    box-shadow:0 3px 0 #000}
  .loot:active{transform:translateY(2px)}
  .loot b{display:block;font-size:13px} .loot small{opacity:.75;font-style:italic}
  .r-common b{color:#e8e8e8}.r-rare b{color:var(--rare)}.r-epic b{color:var(--epic)}
  .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;background:#00000055;margin-left:6px}
</style>
</head>
<body>
<div id="app">
  <div id="logwrap" data-s="mid">
    <div id="logbar">
      <span class="t">Combat Log</span>
      <span class="x" id="logToggle">▤ expand · ▁ min</span>
    </div>
    <div id="log"></div>
  </div>
  <div id="dhead"></div>
  <div id="stage"><canvas id="cv" width="752" height="1128"></canvas></div>
  <div id="party"></div>
  <nav id="dnav">
    <button class="dn-tab" data-nav="keep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-9l2.5-1.6M20 21v-9l-2.5-1.6M6.5 10.4V4.6l2 1.1 1.7-1.1 1.8 1.1 1.7-1.1 2 1.1v5.8M4 12h16M9.5 21v-4.2h5V21"/></svg>Keep</button>
    <button class="dn-tab" data-nav="world"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4"/><path d="M3.6 12h16.8M12 3.6c2.4 2.3 3.7 5.3 3.7 8.4S14.4 18.1 12 20.4C9.6 18.1 8.3 15.1 8.3 12S9.6 5.9 12 3.6Z"/></svg>World</button>
    <div class="dn-cta"><button id="btnStart" data-nav="pause"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></svg><span>Pause</span></button></div>
    <button class="dn-tab" data-nav="arena"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l9.5 9.5M4 8.5L8.5 4M15.5 15.5L20 20M15 19l4-4M19 4l-9.5 9.5M20 8.5L15.5 4M8.5 15.5L4 20M9 19l-4-4"/></svg>Arena</button>
    <button class="dn-tab" data-nav="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu</button>
  </nav>
  <div id="dtoast"></div>
  <div id="overlay"></div>
  <div id="town"></div>
  <div id="flow"></div>
</div>
<script type="module" src="src/game.js"></script>
</body>
</html>
