<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dungeon Pals v2 — The Emberdeep</title>
<script>
  /* URL escape hatch for stale caches: open the site with ?reset (or #reset) to wipe cached data
     + code and reload fresh. Inline so it runs before any module loads and works even when the
     cached app JS is old (index.html?reset is a fresh document fetch). */
  (function () {
    if (/[?&#]reset\b/.test(location.search + location.hash)) {
      var done = function () { location.replace(location.pathname + "?fresh=" + Date.now()); };
      try { localStorage.clear(); } catch (e) {}
      try { sessionStorage.clear(); } catch (e) {}
      var jobs = [];
      try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
      try { if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
      if (jobs.length) Promise.all(jobs).then(done, done); else done();
    } else if (/[?&]fresh=/.test(location.search)) {
      try { history.replaceState(null, "", location.pathname); } catch (e) {}   /* tidy the URL after a reset */
    }
  })();
</script>
<style>
  :root{ --ink:#0c0a12; --panel:#171221; --line:#332a48; --gold:#d8a24a; --parchment:#e8dcc4;
    --hp:#e5484d; --hpbg:#4a1f26; --rare:#4da6ff; --epic:#c77dff; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:radial-gradient(120% 90% at 50% -10%, #241b38 0%, var(--ink) 60%);
    color:var(--parchment); font-family:Georgia,"Times New Roman",serif;
    display:flex; justify-content:center; overflow:hidden; height:100dvh;}
  #app{width:min(500px,100vw);height:100dvh;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 4px) 8px calc(env(safe-area-inset-bottom) + 6px)}

  /* --- floating menu button (opens the game-menu sheet; combat log is an item inside it) --- */
  #dmenufab{position:absolute;z-index:5;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;
    display:none;align-items:center;justify-content:center;padding:0;flex:0 0 auto;
    background:linear-gradient(#241b38,#150f24);border:1px solid #4a3d68;color:var(--parchment);
    box-shadow:0 5px 16px -6px #000, inset 0 1px 0 #ffffff12}
  #dmenufab.show{display:flex}
  #dmenufab:active{transform:translateY(1px)}
  /* Fogbound Floor: corner fog-of-war map (dungeon 1 opt-in) + tap-to-expand full map */
  #floormap{position:absolute;z-index:5;right:11px;top:11px;width:104px;height:150px;padding:5px 5px 3px;display:none;
    flex-direction:column;background:rgba(10,8,18,.82);border:1px solid #4a3d68;border-radius:10px;cursor:pointer;
    box-shadow:0 4px 16px -6px #000;backdrop-filter:blur(2px)}
  #floormap.show{display:flex}
  #floormap:active{transform:translateY(1px)}
  #floormap .fm-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;padding:0 1px}
  #floormap .fm-h b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;color:#8a7fae;font-weight:400}
  #floormap .fm-h .c{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8px;color:var(--gold)}
  #floormap svg{flex:1;width:100%;min-height:0}
  #floormapfull{position:absolute;inset:0;z-index:14;display:none;align-items:center;justify-content:center;padding:18px;
    background:rgba(6,4,10,.72);backdrop-filter:blur(2px)}
  #floormapfull.show{display:flex}
  .fmf{width:100%;max-width:340px;max-height:calc(100dvh - 40px);display:flex;flex-direction:column;
    background:linear-gradient(#221833,#160f26);border:1px solid #4a3d68;border-radius:14px;box-shadow:0 14px 44px #000;overflow:hidden}
  .fmf-h{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border-bottom:1px solid var(--line)}
  .fmf-h b{font-family:Georgia,serif;font-size:15px;color:#fff}
  .fmf-h .sub{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:var(--gold)}
  .fmf-h .x{font-size:16px;color:#8a7fae;cursor:pointer;padding:2px 4px}
  .fmf-map{padding:8px 10px}
  .fmf-map svg{width:100%;height:min(58vh,440px);display:block}
  .fnode{cursor:pointer}
  .fnode:active{opacity:.7}
  .fmf-hint{padding:0 15px 13px;text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9.5px;color:#6f6486;letter-spacing:.04em}
  .fmf-lg{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:center;padding:2px 15px 12px}
  .fmf-lg span{display:flex;align-items:center;gap:5px;font-size:10px;color:#8a7fae}
  .fmf-lg i{width:11px;height:11px;border-radius:3px;display:inline-block}
  #dmenufab svg{width:22px;height:22px}

  /* shared bottom-sheet overlays (combat log + game menu) */
  #dlogov,#dmenu{position:absolute;inset:0;z-index:7;display:none;flex-direction:column;justify-content:flex-end;align-items:center}
  #dlogov.show,#dmenu.show{display:flex}
  .dscrim{position:absolute;inset:0;background:rgba(8,5,14,.62);backdrop-filter:blur(1.5px)}
  .dsheet{position:relative;width:min(484px,calc(100% - 16px));margin-bottom:8px;
    background:linear-gradient(#1d1533,#140e22);border:1px solid #4a3d68;border-radius:16px;
    box-shadow:0 -14px 44px -14px #000;overflow:hidden}
  .dsh{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);
    background:linear-gradient(#221a35,#191226)}
  .dsh .t{font-family:monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
  .dsh .cur{font-family:monospace;font-size:11px;color:#d8c47a;margin-left:auto;display:flex;align-items:center;gap:3px}
  .dsh .x{cursor:pointer;color:#9a8fb8;font-size:18px;line-height:1;padding:2px 6px;margin-left:6px}
  .dsh .x:active{transform:translateY(1px)}
  /* combat log body (now lives in the pop-up) */
  #log{overflow-y:auto;padding:9px 12px;font-size:11px;line-height:1.65;max-height:min(52dvh,360px)}
  #log .hit{color:#ffd166}#log .miss{color:#8b7fa8}#log .crit{color:#ff6b6b;font-weight:bold}
  #log .heal{color:#7ee787}#log .sys{color:#9ad1ff}#log .dmg{color:#ff9b8a}
  /* game-menu grid */
  .dmgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
  .dmrow{display:flex;align-items:center;gap:9px;padding:12px;border-radius:10px;background:#221a38;border:1px solid var(--line);
    cursor:pointer;color:var(--parchment);font-family:Georgia,serif;font-weight:bold;font-size:13px}
  .dmrow:active{transform:translateY(1px)}
  .dmrow svg{width:17px;height:17px;color:#f0c877;flex:0 0 auto}
  .dmrow.wide{grid-column:1/-1}
  .dmrow.danger{color:#ffc0b0;border-color:#5a2a2a;background:#2a1622}.dmrow.danger svg{color:#e5766a}
  /* toggle rows (e.g. Auto-level): an On/Off pill pushed to the right, green when active */
  .dmrow .dm-tag{margin-left:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    padding:2px 8px;border-radius:999px;background:#120d1c;border:1px solid var(--line2);color:#8a8099}
  .dmrow.on{border-color:#3a6a48;background:#182a1f}
  .dmrow.on .dm-tag{color:#8fd39a;border-color:#3a6a48;background:#12241a}
  .dmrow.on svg{color:#8fd39a}

  /* --- dungeon stage: flexes to fill remaining space --- */
  #stage{position:relative;flex:1 1 auto;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:4px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas#cv{max-width:100%;max-height:100%;display:block;border-radius:6px}

  /* --- party at BOTTOM --- */
  #party{flex:0 0 auto;display:flex;gap:6px;margin-top:6px}
  .card{flex:1;display:flex;gap:6px;background:linear-gradient(#241b38,#1a1328);border:1px solid var(--line);
    border-radius:8px;padding:5px;font-size:9.5px;line-height:1.35}
  .card .picwrap{position:relative;flex:0 0 auto;width:36px;height:36px}
  .card .pic{width:36px;height:36px;border-radius:6px;border:1px solid #6e5a2a;display:block}
  .card .skull{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .card b{font-size:10.5px;color:var(--gold)} .card .lvl{color:#9ad1ff}
  .card .cls{color:#9a8fb8;text-transform:capitalize;font-style:italic}
  .card .fallen{color:#c98a8a;font-style:italic;display:inline-flex;align-items:center;gap:3px;margin-top:3px}
  .bar{height:5px;background:var(--hpbg);border-radius:3px;overflow:hidden;margin:2px 0}
  .bar i{display:block;height:100%;background:linear-gradient(#ff7a70,var(--hp));transition:width .25s}
  .card .gear{opacity:.8;font-style:italic}
  /* gear hint: an upgrade or empty-slot fit is waiting in the bag */
  .card .gear-up{display:inline-block;margin-left:5px;font-style:normal;font-size:8px;line-height:1;
    color:#8fd39a;vertical-align:1px;filter:drop-shadow(0 0 4px #8fd39a);animation:gearpulse 1.8s ease-in-out infinite}
  @keyframes gearpulse{0%,100%{opacity:.55}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.card .gear-up{animation:none;opacity:.9}}
  .card.dead{opacity:.8;border-color:#5a2a2a}
  .card.dead .pic{filter:grayscale(1) brightness(.7)}
  /* main hero: centered, slightly larger, gold-framed so the leader stands out */
  .card.main{flex:1.25;border-color:var(--gold);background:linear-gradient(#2c2440,#201636);
    box-shadow:0 0 0 1px rgba(216,162,74,.5) inset, 0 2px 10px rgba(216,162,74,.22)}
  .card.main .picwrap,.card.main .pic{width:44px;height:44px}
  .card.main .pic{border-color:var(--gold)}

  button{font-family:inherit;font-weight:bold;letter-spacing:1px;font-size:12.5px;border:0;border-radius:8px;
    padding:11px 0;flex:1;cursor:pointer;background:linear-gradient(#e0b063,#a8722a);color:#241606;box-shadow:0 3px 0 #6e4a14}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 #6e4a14}
  button[disabled]{opacity:.45;pointer-events:none}

  /* --- slim dungeon header: [menu] title · currency  /  minimap · speed · boss --- */
  #dhead{flex:0 0 auto;display:none;flex-direction:column;gap:6px;margin-bottom:6px;padding:7px 9px 8px;
    border:1px solid var(--line);border-radius:10px;background:linear-gradient(#1b1330,#150f24)}
  #dhead.show{display:flex}
  .dh-r1{display:flex;align-items:center;gap:8px}
  .dh-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dh-title b{font-size:12px;color:#f0c877} .dh-title span{font-size:9.5px;color:#b9add6;font-style:italic}
  .dh-cur{font-family:monospace;font-size:10px;color:#d8c47a;letter-spacing:.5px;flex:0 0 auto;display:flex;align-items:center;gap:3px}
  .dh-r2{display:flex;align-items:center;gap:8px}
  .dh-mini{flex:1;min-width:0;display:flex;align-items:center;gap:0}
  .dh-boss{font-family:monospace;font-size:9px;letter-spacing:.06em;color:var(--gold);background:#120d1c;border:1px solid #5a4a2a;border-radius:999px;padding:2px 7px;white-space:nowrap;flex:0 0 auto}
  .dh-boss.ready{color:#ff9a5c;border-color:#6a3a2a}
  .dh-spd{font-family:monospace;font-size:10px;color:#b9add6;background:#241b38;border:1px solid var(--line);border-radius:7px;padding:2px 7px;cursor:pointer;flex:0 0 auto}
  .dh-fmap{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-family:monospace;font-size:11px;color:var(--gold);
    background:rgba(216,162,74,.09);border:1px solid rgba(216,162,74,.3);border-radius:7px;padding:4px 8px;cursor:pointer;box-shadow:none}
  .dh-fmap:active{transform:translateY(1px)}
  .dh-node{position:relative;flex:1;height:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:none;box-shadow:none;padding:0;border-radius:0}
  .dh-node:active{transform:none}
  .dh-node::before{content:"";position:absolute;left:-50%;right:50%;top:50%;height:2px;background:var(--seg,#3a2f52);z-index:0}
  .dh-node:first-child::before{display:none}
  .dh-node .dot{position:relative;z-index:1;width:13px;height:13px;border-radius:50%;border:1.5px solid var(--nc,#4a4360);
    background:radial-gradient(circle at 40% 35%,#241b38,#0d0a16);display:grid;place-items:center;font-family:monospace;font-size:7px;font-weight:bold;color:var(--nc,#6d6390)}
  .dh-node.done{--nc:#8fd39a;--seg:#2f5a3e} .dh-node.done+.dh-node::before{--seg:#2f5a3e}
  .dh-node.cur .dot{--nc:#f0c877;color:#f0c877;box-shadow:0 0 0 2px rgba(240,200,119,.18)}
  .dh-node.next .dot{border-style:dashed;--nc:#c9a04a}
  .dh-node.boss .dot{border-color:#c0553f} .dh-node.boss.cur .dot{border-color:#f0c877}
  .dh-node.lock{cursor:default} .dh-node.lock .dot{opacity:.5}
  .dh-node.cur:active .dot,.dh-node.done:active .dot,.dh-node.next:active .dot{transform:scale(.85)}

  #dtoast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 74px);transform:translateX(-50%);z-index:6;
    background:#120d1cee;border:1px solid var(--gold);color:var(--gold);font-family:monospace;font-size:11px;padding:7px 13px;
    border-radius:9px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;box-shadow:0 6px 18px #000;max-width:88vw;text-align:center}
  #dtoast.on{opacity:1}

  #overlay{position:absolute;inset:0;background:rgba(8,5,14,.6);display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;padding:20px;z-index:5;backdrop-filter:blur(1.5px)}
  #overlay.show{display:flex}
  #overlay h2{color:var(--gold);letter-spacing:2px;text-transform:uppercase;font-size:18px}
  #overlay p{font-size:12px;opacity:.9;text-align:center;max-width:300px;line-height:1.5}
  .loot{width:100%;max-width:320px;background:linear-gradient(#241b38,#181128);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;font-size:12px;line-height:1.45;
    box-shadow:0 3px 0 #000}
  .loot:active{transform:translateY(2px)}
  .loot b{display:block;font-size:13px} .loot small{opacity:.75;font-style:italic}
  .r-common b{color:#e8e8e8}.r-rare b{color:var(--rare)}.r-epic b{color:var(--epic)}
  .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;background:#00000055;margin-left:6px}
</style>
</head>
<body>
<div id="app">
  <div id="dhead"></div>
  <div id="stage">
    <canvas id="cv" width="752" height="1128"></canvas>
    <button id="floormap" aria-label="Open floor map"></button>
    <button id="dmenufab" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
  <div id="floormapfull"></div>
  <div id="party"></div>
  <div id="dtoast"></div>
  <div id="dlogov"><div class="dscrim" data-dclose></div>
    <div class="dsheet"><div class="dsh"><span class="t">Combat Log</span><span class="x" data-dclose>✕</span></div>
    <div id="log"></div></div></div>
  <div id="dmenu"></div>
  <div id="overlay"></div>
  <div id="town"></div>
  <div id="flow"></div>
</div>
<script type="module" src="src/game.js"></script>
</body>
</html>
